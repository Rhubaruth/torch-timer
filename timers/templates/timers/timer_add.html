{% extends 'core/base.html' %}

{% block content %}
<div class="container">
    <h1 class="title">Add timer</h1>

    {% if not canAdd %}
    <form method="post" action=".">
        {% csrf_token %}

        {{ form.as_p }}
        
        <div class="field is-grouped">
            <div class="control"> 
                <button type="submit" class="button is-primary">Submit</button>
                <button type="cancel" class="button is-danger">Cancel</button>
            </div>
        </div>
    </form>
    {% else %}
        <article class="message is-danger">
            <div class="message-body">
                {{ canAdd }}
            </div>
        </article>
    {% endif %}

</div>
{% endblock %}
